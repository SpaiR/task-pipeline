name: Bash layer tests

# No path filters: besides the helpers, the suite reads every SKILL.md, the
# agents, the plugin manifest and every tracked Markdown file (injection count,
# the driver's registered name, reviewer markers, cross-references), so any
# change can turn it red.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # Both runners on purpose: the helpers are macOS-first (no `realpath`, no
    # GNU-only flags) and ubuntu is what CI defaults to, so a divergence has to
    # show up here rather than on a contributor's laptop.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show bash versions
        run: |
          echo "PATH bash: $(command -v bash)"
          bash --version | head -n 1
          echo "/bin/bash:"
          /bin/bash --version | head -n 1
      - name: Run the suite
        run: bash tests/run.sh
      # If the runner's PATH bash is Homebrew's, stock macOS bash 3.2 would
      # otherwise go untested; the versions printed above show which ran.
      # Informational until it has proven stable, hence continue-on-error.
      - name: Run the suite under /bin/bash (stock macOS bash)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: PATH="/bin:$PATH" bash tests/run.sh

  shellcheck:
    # A pinned, checksum-verified release, so a new shellcheck version cannot
    # turn the job red on its own. `-x -P SCRIPTDIR` follows each `source`
    # relative to the sourcing file; `-S warning` leaves out info and style.
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.10.0
      SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          tarball="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: Lint the bash layer
        run: |
          shellcheck --version
          shellcheck -x -P SCRIPTDIR -S warning \
            skills/_lib/*.sh skills/validate/validate.sh tests/*.sh .claude/hooks/*.sh
